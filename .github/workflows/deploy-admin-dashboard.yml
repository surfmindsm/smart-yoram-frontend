name: Build and Test Admin Dashboard

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'admin-dashboard/**'
      - 'infrastructure/**'
      - '.github/workflows/deploy-admin-dashboard.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'admin-dashboard/**'
      - 'infrastructure/**'

env:
  NODE_VERSION: '18'

jobs:
  build:
    name: Build and Test Admin Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./admin-dashboard
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            ./admin-dashboard/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('./admin-dashboard/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run type checking
        run: npm run type-check
        continue-on-error: true

      - name: Run linting
        run: npm run lint -- --max-warnings 2000
        continue-on-error: true

      - name: Run tests
        run: npm run test -- --coverage --watchAll=false
        continue-on-error: true

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          directory: ./admin-dashboard/coverage
        continue-on-error: true

      - name: Build application
        env:
          REACT_APP_SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL }}
          REACT_APP_SUPABASE_ANON_KEY: ${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}
          REACT_APP_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
          GENERATE_SOURCEMAP: false
          CI: false
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: admin-dashboard-build
          path: admin-dashboard/build/
          retention-days: 7

      - name: Deployment Notice
        run: |
          echo "✅ Build completed successfully!"
          echo "🚀 Vercel will automatically deploy this build from GitHub integration"
          echo "📍 No additional deployment configuration needed"