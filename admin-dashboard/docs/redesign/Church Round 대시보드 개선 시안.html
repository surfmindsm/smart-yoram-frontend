<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Church Round · 대시보드 & IA 개선 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Newsreader:ital,wght@1,400;1,500;1,600&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #EAEDF2; }
  * { -webkit-font-smoothing: antialiased; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="directions/icons.jsx"></script>
<script type="text/babel" src="directions/refined-sky.jsx"></script>
<script type="text/babel" src="directions/warm-sanctuary.jsx"></script>
<script type="text/babel" src="directions/focused-workspace.jsx"></script>

<script type="text/babel" data-presets="react">
  const Canvas = window.DesignCanvas, Section = window.DCSection, Artboard = window.DCArtboard;

  function App() {
    return (
      <Canvas>
        <Section
          id="dashboards"
          title="Church Round · 대시보드 & 내비게이션 개선"
          subtitle="데스크탑 어드민 · 같은 데이터를 세 가지 비주얼·정보구조 방향으로 — 가로로 비교하세요">
          <Artboard id="a" label="A · Refined Sky — 진화형 (절제된 SaaS)" width={1440} height={1024}>
            <RefinedSky />
          </Artboard>
          <Artboard id="b" label="B · Warm Sanctuary — 목양형 (세리프 · 웜 페이퍼)" width={1440} height={1024}>
            <WarmSanctuary />
          </Artboard>
          <Artboard id="c" label="C · Focused Workspace — 운영형 (다크 · 고밀도)" width={1440} height={1024}>
            <FocusedWorkspace />
          </Artboard>
        </Section>
      </Canvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
